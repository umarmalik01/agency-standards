<script>(async()=>{try{const b64=(window.__NRS||[]).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="max-width:620px;padding:28px"><h2>Demo could not load</h2><p>Please open this link in the latest Chrome, Edge, Safari or Firefox.</p><pre style="white-space:pre-wrap;color:#fca5a5">'+String(e)+'</pre></div>'}})();</script></body></html>
